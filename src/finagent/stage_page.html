<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__CLIENT_NAME__ · Under One Roof</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26' fill='none' stroke='%234565d6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 12.5 13 4l10 8.5M6 11v10h14V11M11 21v-5.5h4V21'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Palette, type and shapes taken from sherpaswealth.com: Poppins, Fragment Mono labels, near-black ink,
   one blue, a violet gradient for what matters, pill buttons, soft 20px cards. */
@property --lush { syntax: "<number>"; inherits: true; initial-value: 1; }
:root {
  --ink: #141419; --ink-2: #44445d; --ink-3: #717390; --ink-4: #9799b1;
  --line: #dfe0e8; --line-2: #f0f1f3; --paper: #fcfcfc; --mist: #f6fbff; --white: #fff;
  --night: #0a0c14; --night-2: #10131c;
  --blue: #4565d6; --blue-2: #6586fc; --blue-3: #afbff8; --violet: #948df7; --violet-2: #774be5; --pink: #df7afe;
  --solid: #4565d6; --cracked: #c9871f; --broken: #d6455d; --repaired: #774be5;
  --grad: linear-gradient(127deg, #948df7, #4565d6);
  --sans: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Fragment Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --chat-w: 400px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--paper); line-height: 1.55;
  -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue-2); outline-offset: 3px; }
.mono { font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; }
.pill { display: inline-flex; align-items: center; gap: .5rem; border-radius: 999px; padding: .8rem 1.5rem;
  border: 0; font-weight: 500; transition: transform .2s, box-shadow .2s, background .2s; }
.pill:hover { transform: translateY(-1px); }
.pill.primary { background: var(--white); color: var(--ink); box-shadow: 0 10px 40px rgba(148,141,247,.35); }
.pill.dark { background: var(--ink); color: var(--white); }
.pill.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink-2); padding: .55rem 1.1rem; font-size: .88rem; }

/* ---------- top bar ---------- */
.bar { position: fixed; inset: 0 0 auto 0; z-index: 30; display: flex; align-items: center; gap: 1rem;
  padding: .9rem clamp(1rem, 3vw, 2.2rem); color: var(--white); transition: background .3s, color .3s, box-shadow .3s, right .35s; }
.bar.light { background: rgba(252,252,252,.82); backdrop-filter: blur(14px); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
.brand { white-space: nowrap; display: flex; align-items: center; gap: .6rem; font-weight: 500; letter-spacing: -.01em; margin-right: auto; }
.brand svg { width: 26px; height: 26px; }
.bar select { background: transparent; border: 1px solid currentColor; border-radius: 999px; padding: .4rem .9rem;
  font-size: .85rem; opacity: .85; max-width: 46vw; }
.bar select option { color: var(--ink); }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid currentColor; background: transparent;
  display: grid; place-items: center; opacity: .85; flex: none; }
.icon-btn:hover { opacity: 1; }
.icon-btn svg { width: 19px; height: 19px; }
.sound .off { display: none; }
body.muted .sound .on { display: none; }
body.muted .sound .off { display: block; }

/* ---------- hero: the score ---------- */
.hero { position: relative; min-height: 100svh; display: grid; place-items: center; text-align: center;
  background: var(--night); color: var(--white); padding: 6rem 1.25rem 4rem; overflow: hidden; }
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
.hero::before { width: 46vw; height: 46vw; left: -10vw; top: -14vw; background: #4565d6; }
.hero::after { width: 40vw; height: 40vw; right: -8vw; bottom: -16vw; background: #774be5; }
.hero-in { position: relative; z-index: 1; max-width: 44rem; }
.hero h1 { font-weight: 500; font-size: clamp(2.3rem, 6vw, 4.2rem); line-height: 1.08; letter-spacing: -.03em; margin: 1rem 0 0; }
.hero h1 em { font-style: normal; background: linear-gradient(100deg, #afbff8, #df7afe); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .lede { color: #bfc1d0; font-weight: 300; font-size: 1.08rem; margin: 1rem auto 0; max-width: 30rem; }
.ring { position: relative; width: min(58vw, 250px); aspect-ratio: 1; margin: 2.4rem auto 1.2rem; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; }
.ring .track { stroke: rgba(255,255,255,.1); }
.ring .value { stroke: url(#ringGrad); stroke-linecap: round; transition: stroke-dashoffset 1.6s cubic-bezier(.2,.7,.2,1); }
.ring .num { position: absolute; inset: 0; display: grid; place-content: center; }
.ring .num b { font-weight: 500; font-size: clamp(3.6rem, 12vw, 5.2rem); line-height: 1; letter-spacing: -.04em; }
.ring .num span { color: #9799b1; font-size: .9rem; margin-top: .2rem; }
.band { display: inline-flex; align-items: center; gap: .5rem; border: 1px solid rgba(255,255,255,.2); border-radius: 999px;
  padding: .35rem .95rem; color: #dfe0e8; }
.band i { width: 8px; height: 8px; border-radius: 50%; background: var(--blue-2); }
.band[data-colour="green"] i { background: #4fd1a1; }
.band[data-colour="yellow"] i { background: #f0b849; }
.band[data-colour="red"] i { background: #f0647c; }
.hero .pill { margin-top: 2.2rem; }
.hero .hint { display: block; margin-top: 1.1rem; color: #717390; }

.opts { display: flex; flex-wrap: wrap; gap: .6rem 1rem; justify-content: center; margin-top: 1.5rem; }
.seg { display: inline-flex; align-items: center; gap: .15rem; padding: .25rem; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; }
.seg span { color: #9799b1; padding: 0 .5rem 0 .8rem; }
.seg button { border: 0; background: none; color: #dfe0e8; border-radius: 999px; padding: .4rem .95rem; font-size: .88rem; }
.seg button.on { background: #fff; color: var(--ink); }

/* ---------- the journey ---------- */
main { transition: padding-right .35s; }
.journey { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: clamp(1rem, 3vw, 3rem);
  max-width: 1320px; margin: 0 auto; padding: 0 clamp(1rem, 3vw, 2.2rem); }
.stage { position: sticky; top: 0; height: 100svh; padding: 4.6rem 0 1.2rem; display: flex; flex-direction: column; min-width: 0; }
.scene { position: relative; flex: 1; min-height: 0; border-radius: 28px; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 85% 0%, #ecebff 0%, transparent 55%), radial-gradient(90% 80% at 0% 100%, #e3ecff 0%, transparent 60%), var(--mist);
  display: flex; flex-direction: column; overflow: hidden; }
.scene-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding: 1.2rem 1.4rem 0; }
.when { color: var(--ink-3); }
.when b { display: block; font-family: var(--sans); font-weight: 500; font-size: clamp(1.15rem, 2.2vw, 1.6rem); letter-spacing: -.02em;
  text-transform: none; color: var(--ink); margin-top: .15rem; }
.score-chip { text-align: right; flex: none; }
.score-chip b { font-weight: 500; font-size: clamp(1.8rem, 3.4vw, 2.6rem); letter-spacing: -.03em; line-height: 1; }
.score-chip small { color: var(--ink-3); font-size: .8rem; }
.score-chip .delta { display: inline-block; margin-left: .4rem; padding: .1rem .5rem; border-radius: 999px; background: var(--grad);
  color: #fff; font-size: .78rem; font-weight: 500; vertical-align: middle; opacity: 0; transform: translateY(4px); transition: .4s; }
.score-chip .delta.show { opacity: 1; transform: none; }
#house { flex: 1; min-height: 0; width: 100%; --lush: 1; transition: --lush .7s; }
#house3d { flex: 1; min-height: 0; width: 100%; position: relative; }   /* the home in 3D, only with ?house=3d */
#house3d canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.toast { position: absolute; left: 50%; bottom: 6.4rem; transform: translate(-50%, 8px); background: var(--ink); color: #fff;
  border-radius: 999px; padding: .45rem 1rem; font-size: .84rem; opacity: 0; transition: .35s; white-space: nowrap; pointer-events: none; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.legend { display: flex; flex-wrap: wrap; gap: .4rem; padding: 0 1.1rem 1.1rem; justify-content: center; }
.legend button { display: inline-flex; align-items: center; gap: .45rem; border: 1px solid var(--line); background: rgba(255,255,255,.75);
  border-radius: 999px; padding: .3rem .75rem; font-size: .8rem; color: var(--ink-2); transition: .25s; }
.legend button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.legend button.on { border-color: var(--ink); color: var(--ink); background: #fff; }
.legend button em { font-style: normal; color: var(--ink-4); }
[data-state="solid"] { --c: var(--solid); }
[data-state="cracked"] { --c: var(--cracked); }
[data-state="broken"] { --c: var(--broken); }
[data-state="repaired"] { --c: var(--repaired); }

/* the house */
.part { transition: opacity .45s; cursor: pointer; }
#house.focus .part:not(.on) { opacity: .28; }
.part .crk, .part .dmg { opacity: 0; transition: opacity .6s; }
.part[data-state="cracked"] .crk, .part[data-state="broken"] .crk, .part[data-state="broken"] .dmg { opacity: 1; }
.part .glow { opacity: 0; transition: opacity .8s; }
.part[data-state="repaired"] .glow { opacity: 1; }
.pin circle { fill: var(--c); transition: fill .5s; }
.pin text { fill: #fff; font: 600 13px var(--sans); text-anchor: middle; dominant-baseline: central; }
.pin { transition: transform .4s; transform-box: fill-box; transform-origin: center; }
.part.on .pin { transform: scale(1.25); }
.leaf { fill: color-mix(in srgb, #2f9e77 calc(var(--lush) * 100%), #c4b59d); transition: fill .7s; }
.leaf.b { fill: color-mix(in srgb, #57bf93 calc(var(--lush) * 100%), #d6cab6); }
.canopy { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(calc(.72 + .28 * var(--lush))); transition: transform .7s; }
.bloom { opacity: var(--lush); transition: opacity .7s; }
.drop { animation: drip 1.5s infinite ease-in; }
.drop.d2 { animation-delay: .5s; } .drop.d3 { animation-delay: 1s; }
@keyframes drip { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(48px); opacity: 0; } }
.win { fill: #fff3c9; transition: fill .6s; }

/* chapters */
.chapters { padding: 12vh 0 30vh; min-width: 0; }
.chapter { min-height: 92vh; display: flex; align-items: center; scroll-margin-top: 4rem; }
.card { width: 100%; background: var(--white); border: 1px solid var(--line); border-radius: 22px; padding: clamp(1.2rem, 2.4vw, 2rem);
  box-shadow: 0 18px 50px -30px rgba(20,20,25,.25); opacity: .35; transform: translateY(14px) scale(.985); transition: opacity .45s, transform .45s; }
.chapter.on .card { opacity: 1; transform: none; }
.card .eyebrow { color: var(--ink-3); display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.card h2 { font-weight: 500; font-size: clamp(1.5rem, 2.6vw, 2.1rem); letter-spacing: -.025em; line-height: 1.15; margin: .5rem 0 .8rem; }
.card p { color: var(--ink-2); margin: .7rem 0 0; font-weight: 300; font-size: 1.02rem; }
.state { display: inline-flex; align-items: center; gap: .4rem; padding: .18rem .7rem; border-radius: 999px;
  color: var(--c); background: color-mix(in srgb, var(--c) 10%, #fff); font-size: .8rem; font-weight: 500; text-transform: capitalize; font-family: var(--sans); letter-spacing: 0; }
.state i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.meter { display: flex; align-items: center; gap: .8rem; margin: .2rem 0 .3rem; }
.meter b { font-weight: 500; font-size: 1.5rem; letter-spacing: -.02em; }
.meter b small { color: var(--ink-4); font-weight: 400; font-size: .95rem; }
.meter .track { flex: 1; height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.meter .track i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--c); transition: width 1s .2s cubic-bezier(.2,.7,.2,1); }
.chips { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .9rem; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: .28rem .8rem; font-size: .84rem; color: var(--ink-2); background: var(--paper); }
.chip b { font-weight: 500; color: var(--ink); }
.rows { margin: .9rem 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line-2); }
.rows li { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem 0; border-bottom: 1px solid var(--line-2); font-size: .93rem; color: var(--ink-2); }
.rows li b { font-weight: 500; color: var(--ink); text-align: right; }
.fromto { display: flex; align-items: baseline; gap: .8rem; margin-top: 1.1rem; }
.fromto b { font-weight: 500; font-size: 2.6rem; letter-spacing: -.03em; line-height: 1; }
.fromto .from { color: var(--ink-4); }
.fromto .to { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.fromto span { color: var(--ink-3); font-size: .85rem; }
.action { margin-top: .9rem; padding: .9rem 1rem; border-radius: 14px; background: var(--mist); border: 1px solid #e3ecff; color: var(--ink-2); font-size: .95rem; }
details.action { padding: .55rem 1rem; font-size: .85rem; }
details.action summary { cursor: pointer; color: var(--ink-2); font-size: .85rem; }
details.action[open] summary { margin-bottom: .4rem; }
.say { margin-top: 1.1rem; display: inline-flex; align-items: center; gap: .45rem; border: 0; background: none; padding: 0; color: var(--blue); font-size: .88rem; font-weight: 500; }
.say svg { width: 16px; height: 16px; }

/* the years */
.chapter.years { min-height: 340vh; align-items: flex-start; }
.chapter.years .card { position: sticky; top: 14vh; }
.year-now { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; }
.year-now b { font-weight: 500; font-size: 3rem; letter-spacing: -.04em; line-height: 1; }
.year-now span { color: var(--ink-3); font-size: .92rem; }
.chart { width: 100%; height: auto; margin-top: .8rem; display: block; }
.figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-top: .6rem; }
.figs div { border: 1px solid var(--line-2); border-radius: 12px; padding: .55rem .7rem; min-width: 0; }
.figs span { display: block; color: var(--ink-3); font-size: .72rem; }
.figs b { font-weight: 500; font-size: .98rem; white-space: nowrap; }
.events { list-style: none; margin: .9rem 0 0; padding: 0; display: grid; gap: .3rem; }
.events li { display: flex; gap: .7rem; font-size: .88rem; color: var(--ink-4); transition: color .3s; }
.events li span { font-family: var(--mono); font-size: .76rem; width: 2.7rem; flex: none; padding-top: .12rem; }
.events li.past { color: var(--ink); }
.events li.warn.past { color: var(--broken); }
.note { margin-top: .9rem; font-size: .8rem; color: var(--ink-4); }

/* choose a step */
.steps { display: grid; gap: .55rem; margin-top: 1.1rem; }
.steps button { text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 1rem; border: 1px solid var(--line);
  background: #fff; border-radius: 14px; padding: .8rem 1rem; transition: .2s; }
.steps button:hover { border-color: var(--ink); }
.steps button.chosen { border-color: transparent; background: var(--grad); color: #fff; }
.steps button small { display: block; color: var(--ink-3); font-size: .78rem; }
.steps button.chosen small { color: rgba(255,255,255,.8); }
.steps button b { font-weight: 500; }
.chosen-note { margin-top: .8rem; color: var(--repaired); font-size: .9rem; font-weight: 500; min-height: 1.4em; }

.worry, .due { margin-top: 1.2rem; padding: 1rem; border-radius: 16px; background: var(--mist); border: 1px solid #e3ecff; }
.worry b { display: block; font-weight: 500; font-size: 1.08rem; margin-top: .3rem; }
.worry form { display: flex; gap: .5rem; margin-top: .7rem; }
.worry input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: .6rem 1rem; background: #fff; }
.worry .pill { padding: .6rem 1.1rem; }
.worry .chips button { cursor: pointer; }
.card p.answer { color: var(--ink); font-weight: 400; }
.back { margin-top: 1.3rem; padding-top: 1.1rem; border-top: 1px solid var(--line-2); }
.back .pill { margin-top: .6rem; }
.due { margin-top: .7rem; font-size: .95rem; color: var(--ink-2); }
.due .row { display: flex; gap: .5rem; margin-top: .7rem; flex-wrap: wrap; }
.due .pill { padding: .5rem 1.1rem; font-size: .88rem; margin: 0; }
.first-move { margin-top: .9rem; padding: 1rem 1.1rem; border-radius: 16px; background: var(--mist); border: 1px solid #e3ecff; }
.first-move ol, .due ol { margin: .5rem 0 0 1.1rem; padding: 0; color: var(--ink); }
.first-move li, .due li { margin: .35rem 0; line-height: 1.45; }
.first-move .small, .due .small { margin-top: .6rem; font-size: .85rem; color: var(--ink-2); }
.due form { display: flex; gap: .5rem; margin-top: .6rem; }
.due input { flex: 1; min-width: 0; padding: .5rem .8rem; border-radius: 999px; border: 1px solid #d6e2ff; font: inherit; font-size: .9rem; }
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(10,12,20,.55); backdrop-filter: blur(6px); display: none; place-items: center; padding: 1rem; }
.modal.open { display: grid; }
.sheet { position: relative; background: #fff; border-radius: 22px; max-width: 34rem; width: 100%; max-height: 86vh; overflow: auto; padding: 1.7rem; }
.sheet h3 { font-weight: 500; font-size: 1.45rem; margin: .3rem 0 .2rem; letter-spacing: -.02em; }
.sheet h4 { margin: 1.1rem 0 .3rem; font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 400; }
.sheet ul { margin: 0; padding-left: 1.1rem; }
.sheet ul, .sheet p { color: var(--ink-2); font-size: .95rem; margin-top: 0; margin-bottom: 0; }
.sheet .icon-btn { position: absolute; top: 1rem; right: 1rem; color: var(--ink-2); }
body.simple { font-size: 112%; }
body.simple .card p { font-size: 1.2rem; font-weight: 400; }
body.simple .figs, body.simple .events, body.simple .note, body.simple .rows.own { display: none; }
body.simple .ask-fab { width: 76px; height: 76px; font-size: 2rem; }

.rail { display: flex; gap: 4px; padding: .7rem .2rem 0; }
.rail button { flex: 1; height: 4px; padding: 0; border: 0; border-radius: 2px; background: var(--line); transition: background .3s; position: relative; }
.rail button::after { content: ""; position: absolute; inset: -10px 0; }
.rail button.done { background: var(--blue-3); }
.rail button.on { background: var(--ink); }

/* ---------- ask ---------- */
.ask-fab { position: fixed; right: clamp(1rem, 2.4vw, 2rem); top: 50%; transform: translateY(-50%); z-index: 40; width: 58px; height: 58px; border-radius: 50%;
  border: 0; background: var(--grad); color: #fff; font-size: 1.6rem; font-weight: 500; box-shadow: 0 14px 40px -8px rgba(119,75,229,.6); transition: .3s; }
.ask-fab:hover { transform: translateY(-50%) scale(1.07); }
.ask-fab::after { content: "Ask anything"; position: absolute; right: 70px; top: 50%; transform: translateY(-50%); background: var(--ink); color: #fff;
  font-size: .8rem; font-weight: 400; padding: .35rem .8rem; border-radius: 999px; white-space: nowrap; opacity: 0; pointer-events: none; transition: .25s; }
.ask-fab:hover::after { opacity: 1; }
body.chat-open .ask-fab { opacity: 0; pointer-events: none; }
.chat { position: fixed; top: 0; right: 0; bottom: 0; width: var(--chat-w); max-width: 100vw; z-index: 50; background: var(--night-2); color: #fff;
  display: flex; flex-direction: column; transform: translateX(100%); transition: transform .35s cubic-bezier(.2,.7,.2,1); }
body.chat-open .chat { transform: none; box-shadow: -30px 0 80px -40px rgba(0,0,0,.5); }
.chat header { display: flex; align-items: center; gap: .6rem; padding: 1rem 1.1rem; border-bottom: 1px solid rgba(255,255,255,.08); }
.chat header div { margin-right: auto; }
.chat header b { font-weight: 500; display: block; }
.chat header span { color: #9799b1; }
.chat .icon-btn { border-color: rgba(255,255,255,.25); }
body:not(.muted) .chat .sound { background: #fff; color: var(--ink); border-color: #fff; }
.log { flex: 1; overflow-y: auto; padding: 1.1rem; display: flex; flex-direction: column; gap: .8rem; scroll-behavior: smooth; }
.msg { max-width: 88%; padding: .75rem 1rem; border-radius: 18px; font-size: .94rem; font-weight: 300; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 6px; font-weight: 400; }
.msg.bot { align-self: flex-start; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); border-bottom-left-radius: 6px; }

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const PARTS = ["roof", "walls", "plumbing", "foundations", "garden"];
// A step in the family's words (brain's plain_title); Sherpas' own wording stays folded away for experts.
const stepName = (s) => s.visual.data.plain_title || s.title;
const EFFORT = { low: "Quick to do", medium: "Some work", high: "More work" };
const effortWords = (e) => EFFORT[e] || `${e} effort`;
const PART_OF = { roof: "Protection", walls: "Debt", plumbing: "Cash flow", foundations: "Emergency fund", garden: "Investments" };
const GLYPH = { solid: "✓", cracked: "!", broken: "✕", repaired: "✓" };
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/></svg>';

let P = JSON.parse($("presentation").textContent);
let chapters = [], active = -1, yearIndex = 0, entered = false, askFocus = null, askFocusTimer = 0;
let baseStates = {}, moves = [], timeline = null, chosenStep = null, person = null;
const doneParts = new Set();   // parts repaired because the family said they took the step
const store = {
  get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
  set(key, value) { try { if (value == null) localStorage.removeItem(key); else localStorage.setItem(key, value); } catch (e) { /* private window */ } },
};
// A page made by `finagent.run --all` lives in families/<family>/<mode>/ and knows both from its address.
const WHERE = location.pathname.match(/^(.*\/)families\/([^/]+)\/(complete|simple)\/(?:index\.html)?$/);
const SITE = WHERE ? WHERE[1] : location.pathname.replace(/[^/]*$/, "");
let MODE = WHERE ? WHERE[3] : "complete";

/* ================= voice ================= */
const player = new Audio();
let soundOn = false, playingButton = null, narrationTimer = 0;
try { soundOn = localStorage.getItem("uor-sound") !== "off"; } catch (e) { soundOn = true; }
function showSound() { document.body.classList.toggle("muted", !soundOn); }
function stopVoice() {
  player.pause(); player.removeAttribute("src");
  if (playingButton) { playingButton.classList.remove("playing"); playingButton = null; }
}
function play(src, button) {
  stopVoice();
  if (!soundOn || !src) return;
  player.src = src;
  playingButton = button || null;
  if (button) button.classList.add("playing");
  player.play().catch(() => stopVoice());
}
player.addEventListener("ended", stopVoice);
player.addEventListener("error", stopVoice);
document.querySelectorAll("[data-sound]").forEach((b) => b.addEventListener("click", () => {
  soundOn = !soundOn;
  try { localStorage.setItem("uor-sound", soundOn ? "on" : "off"); } catch (e) { /* private window */ }
  showSound();
  if (!soundOn) stopVoice(); else narrate(active, 0);
}));
function narrate(index, wait = 700) {
  clearTimeout(narrationTimer);
  const chapter = chapters[index];
  if (!entered || !chapter || !chapter.scene || !chapter.scene.audio_path) return;
  narrationTimer = setTimeout(() => { if (active === index) play(chapter.scene.audio_path); }, wait);
}

/* ================= build the page from the presentation ================= */
const fact = (id) => P.facts.find((f) => f.id === id);
const scene = (id) => P.scenes.find((s) => s.id === id);

function build() {
  const intro = scene("intro"), data = intro.visual.data;
  baseStates = data.house || {};
  moves = P.scenes.filter((s) => s.id.startsWith("move_"));
  const line = scene("timeline");
  timeline = line ? line.visual.data : null;
  chosenStep = null;

  document.title = `${P.client_name} · Under One Roof`;
  $("heroName").textContent = P.client_name;
  $("heroBand").dataset.colour = data.colour || "";
  $("heroBand").querySelector("span").textContent = `Sherpas calls that ${data.band}`;
  const score = Number(fact("score").value);
  countTo($("heroScore"), score);
  requestAnimationFrame(() => { $("ringValue").style.strokeDashoffset = 326.7 * (1 - score / 100); });

  document.body.classList.toggle("simple", MODE === "simple");
  doneParts.clear();
  const adults = (data.people || []).filter((p) => p.role !== "child");
  person = adults.length > 1 ? store.get("uor-person-" + P.client_name) : null;
  if (person && !adults.some((p) => p.first_name === person)) person = null;
  const opts = $("opts");
  opts.innerHTML = "";
  const segment = (label, items, current, pick) => {
    const box = el("div", "seg", `<span class="mono">${label}</span>`);
    items.forEach(([value, text]) => {
      const b = el("button", value === current ? "on" : ""); b.textContent = text;
      b.addEventListener("click", () => { [...box.querySelectorAll("button")].forEach((x) => x.classList.toggle("on", x === b)); pick(value); });
      box.append(b);
    });
    opts.append(box);
  };
  if (adults.length > 1) segment("I am", adults.map((p) => [p.first_name, p.first_name]), person, (name) => { person = name; store.set("uor-person-" + P.client_name, name); });
  segment("Guide me", [["simple", "Simply"], ["complete", "In full"]], MODE, (mode) => { if (mode !== MODE) switchTo(api.family, mode); });

  chapters = [];
  const root = $("chapters");
  root.innerHTML = "";

  // 1. the home today
  const people = (data.people || []).map((p) => `<span class="chip"><b>${esc(p.first_name)}</b> ${esc(p.age)}</span>`).join("");
  const home = data.home || {};
  const living = home.kind === "owned" ? `<span class="chip">Home you own</span>` : home.kind === "rented" ? `<span class="chip">Home you rent</span>` : "";
  const cars = (home.cars || []).map((c) => `<span class="chip">${esc(c)}</span>`).join("");
  const weak = PARTS.filter((p) => baseStates[p] && baseStates[p] !== "solid");
  add({ id: "today", tag: "Today", title: "Your home today", scene: intro, html: `
    <div class="eyebrow mono">Today · who lives here</div>
    <h2>This is your home, ${esc(P.client_name)}.</h2>
    <div class="chips">${people}${living}${cars}</div>
    <p>${esc(intro.narration)}</p>
    <ul class="rows">${PARTS.filter((p) => baseStates[p]).map((p) => `<li><span>The ${p} · ${PART_OF[p]}</span><b><span class="state" data-state="${baseStates[p]}"><i></i>${baseStates[p]}</span></b></li>`).join("")}</ul>
    <div class="worry" id="worryBox" hidden><div class="eyebrow mono">Before we walk through it</div>
      <b>What worries you most about money?</b>
      <form id="worryForm"><input id="worryText" placeholder="In your own words" maxlength="300" autocomplete="off"><button class="pill dark">Tell us</button></form>
      <div class="chips" id="worryChips">${((data.worries || []).length ? data.worries : ["Retiring with enough", "An emergency", "Our debts", "The children's future"]).map((w) => `<button type="button" class="chip">${esc(w)}</button>`).join("")}</div>
      <p class="answer" id="worryAnswer" hidden></p></div>
    <p class="note">${weak.length ? "Keep scrolling: we walk through each part, then through the years, then through the repairs." : "Every part stands. Keep scrolling to see how it holds through the years."}</p>` });

  // 2. a walk through the five parts
  P.scenes.filter((s) => s.id.startsWith("pillar_")).forEach((s) => {
    const d = s.visual.data, f = fact(d.fact_id), max = Number(String(f.unit).replace("/", "")) || 100;
    add({ id: s.id, tag: "Today", title: `The ${d.house_part}`, part: d.house_part, scene: s, html: `
      <div class="eyebrow mono">The ${esc(d.house_part)} <span class="state" data-state="${esc(d.state)}"><i></i>${esc(d.state)}</span></div>
      <h2>${esc(s.title)}</h2>
      <div class="meter" data-state="${esc(d.state)}"><b>${esc(f.value)}<small> ${esc(f.unit)}</small></b><div class="track"><i data-w="${Math.round(100 * f.value / max)}"></i></div></div>
      <p>${esc(s.narration)}</p>` });
  });

  // 3. each adult's own part (couples)
  P.scenes.filter((s) => s.id.startsWith("person_")).forEach((s) => {
    const d = s.visual.data, rows = [];
    if (d.salary) rows.push(["Salary, a year", usd.format(d.salary)]);
    (d.accounts || []).forEach((a) => rows.push([a.name, usd.format(a.balance)]));
    (d.debts || []).forEach((x) => rows.push([`${x.name} · ${x.rate_percent}%`, usd.format(x.balance)]));
    if (d.life_cover != null) rows.push(["Life insurance", usd.format(d.life_cover)]);
    if (d.life_shortfall) rows.push(["Short of the recommended minimum", usd.format(d.life_shortfall)]);
    add({ id: s.id, tag: "Today", title: s.title, scene: s, html: `
      <div class="eyebrow mono">In ${esc(d.person)}'s name</div><h2>${esc(s.title)}</h2>
      <ul class="rows own">${rows.map((r) => `<li><span>${esc(r[0])}</span><b>${esc(r[1])}</b></li>`).join("")}</ul>
      <p>${esc(s.narration)}</p>` });
  });

  // 4. the years of the plan as it is today
  if (timeline && timeline.points && timeline.points.length) {
    add({ id: "ahead", tag: "The years ahead", title: line.title, part: "garden", scene: line, html: `
      <div class="eyebrow mono">The years ahead · on today's plan</div>
      <h2>Now watch the garden as the years go by.</h2>
      <p>${esc(line.narration)}</p>
      <p class="note">Keep scrolling: each bit of scroll is a year of your plan.</p>` });
    add({ id: "timeline", tag: "The years ahead", title: "", part: null, scene: null, years: true, html: `
      <div class="eyebrow mono">On today's plan · scroll to move through time</div>
      <div class="year-now"><b id="yNow"></b><span id="yAges"></span></div>
      ${chartSvg()}
      <div class="figs"><div><span>Savings and investments</span><b id="yInv"></b></div><div><span>Debt</span><b id="yDebt"></b></div><div><span>Net worth</span><b id="yNet"></b></div></div>
      <ul class="events" id="yEvents">${milestones().map((m) => `<li data-year="${m.year}" class="${m.warn ? "warn" : ""}"><span>${m.year}</span>${esc(m.label)}</li>`).join("")}</ul>
      <p class="note">These years are the plan as it stands today. Sherpas has not projected them with the repairs made.</p>` });
  }

  // 5. the advisor's steps, one repair each
  moves.forEach((s, i) => {
    const d = s.visual.data, gain = d.score_after - d.score_before;
    add({ id: s.id, tag: `Step ${i + 1} of ${moves.length}`, title: stepName(s), part: d.house_part, scene: s, move: i, html: `
      <div class="eyebrow mono">Step ${i + 1}${d.house_part ? ` · repairs the ${esc(d.house_part)}` : ""} <span class="chip" style="padding:.1rem .6rem;font-family:var(--sans);letter-spacing:0;text-transform:none">${esc(effortWords(d.effort))}</span></div>
      <h2>${esc(stepName(s))}</h2>
      <details class="action"><summary>What your plan says, word for word</summary>${esc(s.title)}: ${esc(d.action)}</details>
      <div class="fromto"><b class="from">${esc(d.score_before)}</b><span>→</span><b class="to">${esc(d.score_after)}</b><span>${gain > 0 ? "your score with this step alone" : "on its own the score stays; it counts together with the others"}</span></div>
      <p>${esc(s.narration)}</p>` });
  });

  // 6. every step done
  const all = scene("all_moves");
  const repairedParts = [...new Set(moves.map((s) => s.visual.data.house_part).filter(Boolean))];
  const left = PARTS.filter((p) => baseStates[p] && baseStates[p] !== "solid" && !repairedParts.includes(p));
  add({ id: "repaired", tag: "Every step done", title: "Your home, repaired", scene: all || null, final: true, html: `
    <div class="eyebrow mono">If you take every step</div>
    <h2>Your home, with the plan carried out.</h2>
    ${all ? `<div class="fromto"><b class="from">${esc(all.visual.data.score_before)}</b><span>→</span><b class="to">${esc(all.visual.data.score_after)}</b><span>${esc((all.visual.data.plain_moves || all.visual.data.moves).join(" + "))}</span></div><p>${esc(all.narration)}</p>`
          : `<p>Sherpas scored each step on its own, so there is no single combined score to promise here. Each repair below shows what it changes by itself.</p>`}
    ${left.length ? `<p class="note">No step in this plan touches the ${esc(left.join(" or the "))} yet. That is a good question for your advisor, or for the “?” button.</p>` : ""}
    <div class="eyebrow mono" style="margin-top:1.4rem">Which one do you start with?</div>
    <div class="steps">${moves.map((s) => `<button data-step="${esc(s.id)}"><span><b>${esc(stepName(s))}</b><small>${esc(effortWords(s.visual.data.effort))} · ${esc(s.visual.data.score_before)} → ${esc(s.visual.data.score_after)}</small></span><span aria-hidden="true">→</span></button>`).join("")}</div>
    <div class="chosen-note" id="chosenNote" aria-live="polite"></div>
    <div class="first-move" id="firstMove" hidden></div>
    <div class="back" id="backBox" hidden>
      <div class="eyebrow mono">A few days later · try it now</div>
      <button class="pill ghost" id="comeBack">Come back three days from now</button>
      <div id="dueList" aria-live="polite"></div>
      <button class="pill ghost" id="noteBtn">See what your advisor receives</button>
    </div>` });
  $("comeBack").addEventListener("click", comeBack);
  $("noteBtn").addEventListener("click", showNote);
  $("worryForm").addEventListener("submit", (e) => { e.preventDefault(); tellWorry($("worryText").value); });
  $("worryChips").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => tellWorry(b.textContent)));

  root.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => chooseStep(b)));
  root.querySelectorAll(".chapter").forEach((c, i) => {
    const s = chapters[i].scene;
    if (s && s.audio_path) {
      const b = el("button", "say", `${SPEAKER} Hear this`);
      b.addEventListener("click", () => { entered = true; if (!soundOn) { soundOn = true; showSound(); } play(s.audio_path); });
      c.querySelector(".card").append(b);
    }
  });

  $("rail").innerHTML = "";
  chapters.forEach((c, i) => {
    const b = el("button"); b.title = c.title || c.tag; b.setAttribute("aria-label", c.title || c.tag);
    b.addEventListener("click", () => c.node.scrollIntoView({ block: c.years ? "start" : "center" }));
    $("rail").append(b);
  });
  $("legend").innerHTML = "";
  PARTS.filter((p) => baseStates[p]).forEach((p) => {
    const b = el("button", "", `<i></i>${p[0].toUpperCase() + p.slice(1)} <em>${PART_OF[p]}</em>`);
    b.dataset.part = p;
    b.addEventListener("click", () => goToPart(p));
    $("legend").append(b);
  });
  suggestions();
  active = -1;
  update();
}

function add(chapter) {
  const node = el("section", "chapter" + (chapter.years ? " years" : ""));
  node.id = "ch-" + chapter.id;
  node.append(el("div", "card", chapter.html));
  $("chapters").append(node);
  chapters.push({ ...chapter, node });
}

function milestones() {
  const list = [];
  (timeline.events || []).forEach((e) => {
    if (!e.year) return;
    if (e.kind === "retirement") list.push({ year: e.year, label: `${e.person} retires at ${e.age}` });
    if (e.kind === "debt_free") list.push({ year: e.year, label: "No debt left in the plan" });
    if (e.kind === "savings_run_out") list.push({ year: e.year, label: `Savings and investments run out at age ${e.age}`, warn: true });
    if (e.kind === "savings_last") list.push({ year: e.year, label: "Savings and investments last to the end of the plan" });
  });
  (timeline.dates || []).forEach((d) => {
    if (d.kind !== "retirement") list.push({ year: Number(d.date.slice(0, 4)), label: d.name + (d.repeats ? " (it repeats)" : "") });
  });
  return list.sort((a, b) => a.year - b.year);
}

function chartSvg() {
  const pts = timeline.points, W = 320, H = 96, max = Math.max(...pts.map((p) => p.investable_assets), 1);
  const x = (i) => (i / (pts.length - 1 || 1)) * W, y = (v) => H - 6 - (v / max) * (H - 16);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.investable_assets).toFixed(1)}`).join(" ");
  return `<svg class="chart" id="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#948df7" stop-opacity=".35"/><stop offset="1" stop-color="#948df7" stop-opacity="0"/></linearGradient></defs>
    <path d="${path} L${W} ${H} L0 ${H}Z" fill="url(#gArea)"/><path d="${path}" fill="none" stroke="#4565d6" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <line id="chartCursor" x1="0" x2="0" y1="0" y2="${H}" stroke="#141419" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function countTo(node, target, from = 0) {
  const start = performance.now(), span = 1300;
  const step = (now) => {
    const t = Math.min(1, (now - start) / span), eased = 1 - Math.pow(1 - t, 3);
    node.textContent = Math.round(from + (target - from) * eased);
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ================= scroll drives the home ================= */
function update() {
  const vh = innerHeight, narrow = innerWidth <= 860;
  const probe = narrow ? vh * 0.74 : vh * 0.5;
  let index = 0;
  chapters.forEach((c, i) => { if (c.node.getBoundingClientRect().top <= probe) index = i; });
  const journeyTop = $("journey").getBoundingClientRect().top;
  $("bar").classList.toggle("light", journeyTop < 60);

  const chapter = chapters[index];
  if (chapter.years) {
    const rect = chapter.node.getBoundingClientRect(), card = chapter.node.querySelector(".card");
    const top = parseFloat(getComputedStyle(card).top) || 0;
    const travel = Math.max(1, rect.height - card.offsetHeight);
    const progress = Math.min(1, Math.max(0, (top - rect.top) / travel));
    const i = Math.round(progress * (timeline.points.length - 1));
    if (i !== yearIndex || active !== index) { yearIndex = i; showYear(); }
  }
  if (index !== active) {
    active = index;
    chapters.forEach((c, i) => c.node.classList.toggle("on", i === index));
    chapter.node.querySelectorAll(".track i").forEach((bar) => { bar.style.width = bar.dataset.w + "%"; });
    [...$("rail").children].forEach((b, i) => { b.classList.toggle("on", i === index); b.classList.toggle("done", i < index); });
    if (journeyTop < vh * 0.6) narrate(index);
  }
  paint();
}

/* ---- the home in 3D: only when asked for (?house=3d), never in the simple mode. The drawn home is the fallback. ---- */
let house3d = null;
function drawnHome() {
  if (house3d) { house3d.dispose(); house3d = null; }
  $("house3d").hidden = true;
  $("house").style.display = "";
}
async function tryHouse3d() {
  // ?house=3d turns it on and ?house=2d off; it is remembered while the tab is open, so it survives a change of family.
  const asked = new URLSearchParams(location.search).get("house");
  try { if (asked) sessionStorage.setItem("uor-house", asked); } catch (e) { /* private window */ }
  let wanted = asked;
  try { wanted = wanted || sessionStorage.getItem("uor-house"); } catch (e) { /* private window */ }
  if (wanted !== "3d" || MODE === "simple" || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  try {
    const { mount } = await import(SITE + "web/house3d.js");   // served by the backend; opened as a file this fails
    $("house3d").hidden = false;
    house3d = mount($("house3d"), { onFail: drawnHome, onPick: goToPart });
    $("house").style.display = "none";
    paint();
  } catch (e) {
    console.warn("The 3D home could not start; showing the drawn one.", e);
    drawnHome();
  }
}

function stateOf(part) {
  if (doneParts.has(part)) return "repaired";
  const chapter = chapters[active] || {};
  const upTo = chapter.final ? moves.length - 1 : chapter.move != null ? chapter.move : -1;
  for (let i = 0; i <= upTo; i++) if (moves[i].visual.data.house_part === part) return "repaired";
  return baseStates[part];
}

function paint() {
  const chapter = chapters[active] || {};
  const focus = askFocus || chapter.part || null;
  $("house").classList.toggle("focus", Boolean(focus));
  let lush = 1;
  const states = {};
  PARTS.forEach((part) => {
    const node = $("p-" + part); let state = stateOf(part) || "solid";
    node.style.display = baseStates[part] ? "" : "none";
    if (chapter.years && part === "garden" && timeline.points[yearIndex].investable_assets <= 0) state = "broken";
    node.dataset.state = state;
    states[part] = baseStates[part] ? state : null;
    node.classList.toggle("on", focus === part);
    node.querySelector(".pin text").textContent = GLYPH[state];
    const chip = $("legend").querySelector(`[data-part="${part}"]`);
    if (chip) { chip.dataset.state = state; chip.classList.toggle("on", focus === part); }
    if (part === "garden") lush = { solid: 1, repaired: 1, cracked: 0.55, broken: 0.15 }[state];
  });

  let tag = chapter.tag || "", title = chapter.title || "", score = Number(fact("score").value), delta = "";
  if (chapter.years) {
    const pts = timeline.points, p = pts[yearIndex], max = Math.max(...pts.map((q) => q.investable_assets), 1);
    lush = Math.max(0.04, p.investable_assets / max);
    title = String(p.year);
  }
  if (chapter.move != null) {
    const d = chapter.scene.visual.data;
    score = d.score_after;
    if (d.score_after > d.score_before) delta = "+" + (d.score_after - d.score_before);
  }
  if (chapter.final && chapter.scene) {
    const d = chapter.scene.visual.data;
    score = d.score_after; delta = "+" + (d.score_after - d.score_before);
  }
  $("house").style.setProperty("--lush", lush);
  if (house3d) house3d.update({ states, focus, lush });
  $("whenTag").textContent = tag;
  $("whenTitle").textContent = title;
  if ($("chipScore").textContent !== String(score)) $("chipScore").textContent = score;
  $("chipDelta").textContent = delta;
  $("chipDelta").classList.toggle("show", Boolean(delta));
  if (!chapter.years) toast("");
}

function showYear() {
  const p = timeline.points[yearIndex], people = scene("intro").visual.data.people || [];
  const adults = people.filter((x) => x.role !== "child");
  const ages = [p.age_client, p.age_co_client].map((age, i) => (age != null && adults[i] ? `${adults[i].first_name} is ${age}` : null)).filter(Boolean);
  $("yNow").textContent = p.year;
  $("yAges").textContent = ages.join(" · ");
  $("yInv").textContent = usd.format(p.investable_assets);
  $("yDebt").textContent = usd.format(p.total_debts);
  $("yNet").textContent = usd.format(p.net_worth);
  $("chartCursor").setAttribute("x1", (yearIndex / (timeline.points.length - 1 || 1)) * 320);
  $("chartCursor").setAttribute("x2", (yearIndex / (timeline.points.length - 1 || 1)) * 320);
  let latest = null;
  $("yEvents").querySelectorAll("li").forEach((li) => {
    const past = Number(li.dataset.year) <= p.year;
    li.classList.toggle("past", past);
    if (past && p.year - Number(li.dataset.year) <= 2) latest = li;
  });
  toast(latest ? `${latest.dataset.year} · ${latest.lastChild.textContent}` : "");
}

function toast(text) {
  const node = $("toast");
  if (text) node.textContent = text;
  node.classList.toggle("show", Boolean(text));
}

function goToPart(part) {
  const target = chapters.find((c) => c.part === part && c.id.startsWith("pillar_"));
  if (target) target.node.scrollIntoView({ block: "center" });
}
document.querySelectorAll(".part").forEach((node) => node.addEventListener("click", () => goToPart(node.dataset.part)));

let ticking = false;
const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; update(); }); } };
addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", onScroll);

$("enter").addEventListener("click", () => {
  entered = true;
  if (active >= 0) narrate(active, 900);
  $("journey").scrollIntoView();
});

/* ================= the backend: questions, the chosen step, other families ================= */
const api = { base: null, family: WHERE ? WHERE[2] : null, session: null, ready: null };
function setSession(id) {
  api.session = id || null;
  if (api.family) store.set("uor-session-" + api.family, api.session);
}
async function findBackend() {
  const bases = location.protocol.startsWith("http") ? ["", "http://localhost:8000"] : ["http://localhost:8000"];
  for (const base of bases) {
    try {
      const response = await fetch(base + "/families", { signal: AbortSignal.timeout(2500) });
      if (!response.ok) continue;
      const families = await response.json();
      api.base = base;
      const mine = families.find((f) => f.client_name === P.client_name);
      if (!api.family) api.family = mine ? mine.family : null;
      const select = $("family");
      select.innerHTML = families.map((f) => `<option value="${esc(f.family)}">${esc(f.client_name)} · ${esc(f.score)}</option>`).join("");
      if (api.family) select.value = api.family;
      select.hidden = families.length < 2;
      return true;
    } catch (e) { /* try the next address */ }
  }
  return false;
}
$("family").addEventListener("change", (event) => switchTo(event.target.value, MODE));

// Another family or the other mode: the page made for it (with its voice) when it exists, else the same
// page redrawn with what the backend sends (no narration voice).
async function switchTo(family, mode) {
  if (!family) return;
  stopVoice();
  const page = `${SITE}families/${family}/${mode}/index.html`;
  if (!location.protocol.startsWith("http")) { location.href = page; return; }
  try {
    if ((await fetch(page, { method: "HEAD" })).ok) { location.href = page; return; }
  } catch (e) { /* no such page: ask the backend */ }
  try {
    const response = await fetch(`${api.base}/presentation/${family}?mode=${mode}`);
    if (!response.ok) throw new Error();
    P = await response.json();
    api.family = family; api.session = null; MODE = mode;
    $("log").innerHTML = "";
    build();
    if (MODE === "simple") drawnHome();
    await afterBackend();
    scrollTo({ top: 0 });
  } catch (e) { $("family").value = api.family; }
}

// Once the backend answers: show what needs it, and bring back the visit this browser already started.
async function afterBackend() {
  if (!(await api.ready) || !api.family) return;
  $("worryBox").hidden = false;
  $("backBox").hidden = false;
  const saved = store.get("uor-session-" + api.family);
  if (!saved || api.session) return;
  try {
    const response = await fetch(`${api.base}/history?session_id=${encodeURIComponent(saved)}`);
    if (!response.ok) { store.set("uor-session-" + api.family, null); return; }
    const history = await response.json();
    api.session = saved;
    if (history.turns.length) message("info", "Your earlier questions");
    history.turns.forEach((turn) => { message("me", turn.question); botMessage(message("bot"), turn, false); });
    if (history.decision) {
      const button = document.querySelector(`[data-step="${history.decision.scene_id}"]`);
      if (button) { button.classList.add("chosen"); $("chosenNote").textContent = `Chosen: ${history.decision.title}.`; }
      const step = scene(history.decision.scene_id);
      if (step && history.follow_up && history.follow_up.done && step.visual.data.house_part) { doneParts.add(step.visual.data.house_part); paint(); }
    }
  } catch (e) { /* the page works without the earlier visit */ }
}

async function tellWorry(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  entered = true;
  stopVoice();
  const out = $("worryAnswer");
  out.hidden = false;
  out.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  try {
    const response = await fetch(api.base + "/worry", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ family: api.family, worry: text, session_id: api.session, person, mode: MODE }) });
    const turn = await response.json();
    if (!response.ok) throw new Error(typeof turn.detail === "string" ? turn.detail : "");
    setSession(turn.session_id);
    out.textContent = turn.text;
    $("worryText").value = "";
    message("me", text);
    botMessage(message("bot"), turn, true);
    turnHome(turn.house_part);
  } catch (error) { out.textContent = error.message || "I could not answer that just now. Please try again."; }
  busy = false;
}

async function comeBack() {
  const list = $("dueList");
  if (!api.session) { list.innerHTML = '<div class="due">Choose a first step above, or ask a question, and then come back.</div>'; return; }
  try {
    const day = new Date(Date.now() + 4 * 864e5).toISOString().slice(0, 10);
    const response = await fetch(`${api.base}/reminders?session_id=${encodeURIComponent(api.session)}&today=${day}`);
    const data = await response.json();
    list.innerHTML = "";
    if (!data.due.length) list.append(el("div", "due", "Nothing is waiting for you yet."));
    data.due.forEach((due) => {
      const box = el("div", "due");
      box.textContent = due.text;
      if (due.kind === "check_in") {
        const row = el("div", "row");
        [["Yes, I started", true, "pill dark"], ["Not yet", false, "pill ghost"]].forEach(([label, done, cls]) => {
          const b = el("button", cls); b.textContent = label;
          b.addEventListener("click", () => (done ? followUp(true, box) : askWhatGotInTheWay(box)));
          row.append(b);
        });
        box.append(row);
      }
      list.append(box);
    });
  } catch (e) { list.innerHTML = '<div class="due">The server did not answer. Please try again.</div>'; }
}

async function followUp(done, box, note = null, reply = "") {
  try {
    const response = await fetch(api.base + "/follow-up", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: api.session, done, note }) });
    const data = await response.json();
    if (!response.ok) throw new Error();
    const part = data.repaired_house_part;
    if (part) { doneParts.add(part); turnHome(part); }
    if (done) {
      box.textContent = `Well done. ${part ? `Your ${part} ${part.endsWith("s") ? "are" : "is"} repaired, and your` : "Your"} advisor will see it.`;
    } else {
      box.innerHTML = `<div>${reply}</div><div class="small">Your advisor will see what got in the way, so the next talk starts there.</div>`;
    }
  } catch (e) { box.append(el("div", "", "That did not go through. Please try again.")); }
}

async function showNote() {
  const sheet = $("sheet");
  const close = '<button class="icon-btn" id="noteClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>';
  const show = (html) => { sheet.innerHTML = close + html; $("noteClose").addEventListener("click", () => $("modal").classList.remove("open")); };
  $("modal").classList.add("open");
  const head = `<div class="mono" style="color:var(--ink-3)">For the advisor</div><h3>${esc(P.client_name)}'s visit</h3>`;
  if (!api.session) return show(head + "<p>Nothing yet. Ask a question, say what worries you or choose a first step, and it appears here.</p>");
  try {
    const response = await fetch(`${api.base}/advisor-note?session_id=${encodeURIComponent(api.session)}`);
    if (!response.ok) throw new Error();
    const note = await response.json();
    const list = (items) => (items && items.length ? `<ul>${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : "<p>Nothing yet.</p>");
    const follow = note.follow_up
      ? (note.follow_up.done ? "They said they started it."
         : `They said: not yet.${note.follow_up.note ? ` What got in the way: “${esc(note.follow_up.note)}”` : ""}`)
      : "Not asked yet.";
    const chosen = note.decision
      ? esc(note.decision.plain_title || note.decision.title)
        + (note.decision.plain_title && note.decision.plain_title !== note.decision.title ? ` <span class="small">(Sherpas: ${esc(note.decision.title)})</span>` : "")
      : "None yet.";
    show(head + `<p>${note.person ? esc(note.person) + " · " : ""}${esc(note.mode || MODE)} mode</p>
      <h4>What worries them</h4>${list(note.worries)}
      <h4>What they asked</h4>${list(note.questions)}
      <h4>Asked most about</h4><p>${note.asked_most_about.length ? esc(note.asked_most_about.map((p) => "the " + p).join(", ")) : "Nothing yet."}</p>
      <h4>The plan did not cover</h4>${list(note.not_covered_by_the_plan)}
      <h4>First step chosen</h4><p>${chosen}</p>
      <h4>Three days later</h4><p>${follow}</p>`);
  } catch (e) { show(head + "<p>The server did not answer. Please try again.</p>"); }
}
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) $("modal").classList.remove("open"); });

const firstMovesHtml = (step) =>
  `<ol>${(step.visual.data.first_moves || []).map((m) => `<li>${esc(m)}</li>`).join("")}</ol>`;
const isCouple = () => P.scenes.some((s) => s.id.startsWith("person_"));

// "Not yet" at the day-3 check-in: ask what got in the way, answer that obstacle, and tell the advisor.
const obstacles = () => [
  ["I don't know where to start", () => chosenStep
      ? `Here is the first move again.${firstMovesHtml(chosenStep)}` : "Open the step again above and start with its first move."],
  ["It costs more than I expected", () =>
      "That is a fair worry, and the cost is not in your plan. Your advisor can help you compare before you decide."],
  ...(isCouple()
    ? [["We haven't agreed yet", () =>
        "That is normal. Open the “?” together and ask your questions in your own words: the home answers both of you."]]
    : [["I haven't had the time", () => "That is fine. The first move takes a few minutes, whenever you are ready."]]),
];

function askWhatGotInTheWay(box) {
  box.innerHTML = `<div>No rush. What got in the way?</div>`;
  const row = el("div", "row");
  obstacles().forEach(([label, reply]) => {
    const b = el("button", "pill ghost"); b.textContent = label;
    b.addEventListener("click", () => followUp(false, box, label, reply()));
    row.append(b);
  });
  const form = el("form");
  form.innerHTML = '<input aria-label="Or tell us in your own words" placeholder="Or tell us in your own words"><button class="pill dark">Send</button>';
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = form.querySelector("input").value.trim();
    if (text) followUp(false, box, text, "Thank you for telling us.");
  });
  box.append(row, form);
}

async function chooseStep(button) {
  document.querySelectorAll("[data-step]").forEach((b) => b.classList.toggle("chosen", b === button));
  const step = scene(button.dataset.step);
  chosenStep = step;
  $("chosenNote").textContent = `Chosen: ${stepName(step)}. Tell your advisor this is where you start.`;
  const box = $("firstMove");
  box.innerHTML = `<div class="eyebrow mono">Your first move, tomorrow</div>${firstMovesHtml(step)}
    <div class="small">A few minutes is enough. You do not have to finish it in one go.</div>`;
  box.hidden = false;
  if (!(await api.ready) || !api.family) return;
  try {
    const response = await fetch(api.base + "/decision", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ family: api.family, scene_id: step.id, session_id: api.session }) });
    if (response.ok) {
      setSession((await response.json()).session_id);
      $("chosenNote").textContent = `Chosen: ${stepName(step)}. Your advisor will see it, and we check in with you in three days.`;
    }
  } catch (e) { /* the choice still shows on the page */ }
}

/* ---- the chat ---- */
const log = $("log");
function message(kind, text) {
  const node = el("div", "msg " + kind);
  node.textContent = text || "";
  log.append(node);
  log.scrollTop = log.scrollHeight;
  return node;
}
function suggestions() {
  const weak = PARTS.find((p) => baseStates[p] === "broken") || PARTS.find((p) => baseStates[p] === "cracked");
  const list = [weak ? `Why ${weak.endsWith("s") ? "are" : "is"} my ${weak} ${baseStates[weak]}?` : "What is the strongest part of my plan?",
    "What should I do first?", "What happens when I retire?"];
  $("suggest").innerHTML = "";
  list.forEach((q) => { const b = el("button"); b.textContent = q; b.addEventListener("click", () => ask(q)); $("suggest").append(b); });
}
function openChat(open) {
  document.body.classList.toggle("chat-open", open);
  if (open) {
    if (!log.children.length) message("info", "Ask in your own words. The home turns to the part you ask about.");
    setTimeout(() => $("question").focus({ preventScroll: true }), 350);
  }
  setTimeout(onScroll, 380);
}
$("askFab").addEventListener("click", () => openChat(true));
$("chatClose").addEventListener("click", () => openChat(false));
addEventListener("keydown", (e) => { if (e.key === "Escape") { openChat(false); $("modal").classList.remove("open"); } });
$("askForm").addEventListener("submit", (e) => { e.preventDefault(); const q = $("question").value.trim(); if (q) { $("question").value = ""; ask(q); } });

let busy = false;
async function ask(question, recording) {
  if (busy) return;
  busy = true;
  openChat(true);
  entered = true;
  stopVoice();
  $("suggest").hidden = true;
  const mine = message("me", question || "…");
  const answer = message("bot");
  answer.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  try {
    if (!(await api.ready) || !api.family) throw new Error("offline");
    const form = new FormData();
    form.append("family", api.family);
    if (api.session) form.append("session_id", api.session);
    if (recording) form.append("file", recording, recordingName(recording)); else form.append("question", question);
    form.append("mode", MODE);
    if (person) form.append("person", person);
    form.append("pace_ms", "45");
    const response = await fetch(api.base + "/ask/stream", { method: "POST", body: form });
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}));
      throw new Error(typeof detail.detail === "string" ? detail.detail : "failed");
    }
    let text = "", turn = null;
    await readEvents(response, (name, data) => {
      if (name === "thinking") { setSession(data.session_id); mine.textContent = data.question; }
      if (name === "turn") turnHome(data.house_part);
      if (name === "delta") { text += data.text; answer.textContent = text; log.scrollTop = log.scrollHeight; }
      if (name === "done") turn = data;
    });
    if (!turn) throw new Error("failed");
    botMessage(answer, turn, true);
  } catch (error) {
    answer.textContent = error.message === "offline"
      ? "Live questions need the Under One Roof server. Start it with scripts/serve.sh and open the page from there."
      : error.message && error.message !== "failed" ? error.message : "I could not answer that just now. Please try again.";
  }
  log.scrollTop = log.scrollHeight;
  busy = false;
}

function botMessage(node, turn, speak) {
  node.textContent = turn.text;
  const meta = el("div", "meta");
  const src = api.base + (turn.audio_url || `/answers/${api.session}/${turn.turn_id}.mp3`);
  const listen = el("button"); listen.textContent = "▶ Listen";
  listen.addEventListener("click", () => {
    if (playingButton === listen) return stopVoice();
    if (!soundOn) { soundOn = true; showSound(); }
    play(src, listen);
  });
  meta.append(listen);
  if (turn.house_part) meta.append(el("span", "", `the ${esc(turn.house_part)}`));
  node.append(meta);
  log.scrollTop = log.scrollHeight;
  if (speak) play(src, listen);
}

// Server-sent events over fetch (EventSource cannot POST).
async function readEvents(response, on) {
  const reader = response.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {
      const block = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
      const name = (block.match(/^event: (.*)$/m) || [])[1], data = (block.match(/^data: (.*)$/m) || [])[1];
      if (name && data) on(name, JSON.parse(data));
    }
  }
}

function turnHome(part) {
  if (!part || !baseStates[part]) return;
  askFocus = part;
  clearTimeout(askFocusTimer);
  askFocusTimer = setTimeout(() => { askFocus = null; paint(); }, 9000);
  // Instant, not smooth: the chat log scrolls smoothly as the answer streams in, and Chrome cancels one smooth
  // scroll when another starts, which left the page on the hero instead of the home.
  if ($("journey").getBoundingClientRect().top > innerHeight * 0.4) $("journey").scrollIntoView({ behavior: "instant" });
  paint();
}

/* ---- tap to talk: one tap starts, the next tap sends. Holding the button while you speak works too. ---- */
const HOLD_MS = 1000;             // a press at least this long is "hold to talk": letting go sends (a slow tap is not)
const MAX_RECORDING_MS = 30000;   // a forgotten recording sends itself
const ASK_HINT = $("question").placeholder;
let recorder = null, chunks = [], starting = false, pressedAt = 0, recordingTimer = 0, byPointer = false;
const mic = $("mic");
// Browsers record in different formats (Chrome: webm, iPhone: mp4, Firefox: ogg); the name tells the server which.
function recordingName(blob) {
  const type = blob.type || "";
  return "question." + (type.includes("mp4") ? "mp4" : type.includes("ogg") ? "ogg" : "webm");
}
function showMic(listening) {
  mic.classList.toggle("rec", listening);
  const label = listening ? "Tap to send" : "Tap to talk";
  mic.title = label;
  mic.setAttribute("aria-label", label);
  $("question").placeholder = listening ? "Listening… tap the microphone to send" : ASK_HINT;
}
async function startTalking() {
  starting = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = () => {
      clearTimeout(recordingTimer);
      stream.getTracks().forEach((t) => t.stop());
      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      recorder = null;
      showMic(false);
      if (blob.size > 1500) ask("", blob);
    };
    recorder.start();
    recordingTimer = setTimeout(stopTalking, MAX_RECORDING_MS);
    showMic(true);
    stopVoice();
  } catch (e) {
    message("info", "The microphone is not available here. You can type your question.");
  } finally {
    starting = false;
  }
}
function stopTalking() { if (recorder && recorder.state === "recording") recorder.stop(); }
function micPressed() {
  if (busy || starting) return;
  if (recorder) { pressedAt = 0; return stopTalking(); }   // second tap: send
  pressedAt = Date.now();
  startTalking();
}
mic.addEventListener("pointerdown", (event) => { event.preventDefault(); byPointer = true; micPressed(); });
mic.addEventListener("pointerup", () => {
  // Let go after a long press: that was hold to talk. After a quick tap it keeps listening until the next tap.
  if (recorder && pressedAt && Date.now() - pressedAt >= HOLD_MS) stopTalking();
  pressedAt = 0;
});
// A tap or a mouse press has already been handled by pointerdown; the click that follows it must not count as
// a second tap (it stopped the recording at once on an iPhone). A click on its own is the keyboard.
mic.addEventListener("click", () => { if (byPointer) byPointer = false; else micPressed(); });
mic.addEventListener("contextmenu", (event) => event.preventDefault());                // long press on a phone

showSound();
build();
tryHouse3d();
api.ready = findBackend();
afterBackend();
</script>
